<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №6 — Завдання 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">

<div class="header">
    <a class="header-link" href="#">Mail</a>
    <a class="header-link" href="#">Images</a>

    <div class="popup-wrapper">
        <!-- Прихований checkbox: саме він перемикає попап і отримує фокус з клавіатури -->
        <input class="popup-toggle" type="checkbox" id="popup-toggle">
        <label class="popup-button" for="popup-toggle">▦</label>

        <div class="popup">
            <!-- tabindex="0", щоб вміст можна було прокручувати стрілками -->
            <div class="popup-content" tabindex="0">
                <a class="popup-item" href="#"><span class="popup-icon">📅</span>Calendar</a>
                <a class="popup-item" href="#"><span class="popup-icon">✉️</span>Mail</a>
                <a class="popup-item" href="#"><span class="popup-icon">📰</span>News</a>
                <a class="popup-item" href="#"><span class="popup-icon">🗺️</span>Map</a>
                <a class="popup-item" href="#"><span class="popup-icon">📁</span>Files</a>
                <a class="popup-item" href="#"><span class="popup-icon">👤</span>Contacts</a>
                <a class="popup-item" href="#"><span class="popup-icon">🌐</span>Translate</a>
                <a class="popup-item" href="#"><span class="popup-icon">🎬</span>Videos</a>
                <a class="popup-item" href="#"><span class="popup-icon">🔍</span>Search</a>

                <!-- Додаткові іконки (6 штук), з'являються після натискання "More" -->
                <a class="popup-item popup-item--extra" href="#"><span class="popup-icon">🖼️</span>Photos</a>
                <a class="popup-item popup-item--extra" href="#"><span class="popup-icon">🧩</span>Apps</a>
                <a class="popup-item popup-item--extra" href="#"><span class="popup-icon">📄</span>Documents</a>
                <a class="popup-item popup-item--extra" href="#"><span class="popup-icon">💬</span>Chat</a>
                <a class="popup-item popup-item--extra" href="#"><span class="popup-icon">🎓</span>Classroom</a>
                <a class="popup-item popup-item--extra" href="#"><span class="popup-icon">⭐</span>Collection</a>
            </div>

            <input class="more-toggle" type="checkbox" id="more-toggle">
            <label class="more-button" for="more-toggle">More</label>
        </div>
    </div>
</div>

</body>
</html>
