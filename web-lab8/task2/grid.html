<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>CSS Grid Basics</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

<h2>Основна сітка</h2>
<div class="grid">
    <div class="item">1 — span 2</div>
    <div class="item">2 — 2 рядки</div>
    <div class="item">3 — розміщення</div>
    <div class="item">4 — на всю ширину</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
</div>

<h2>Автоматична сітка</h2>
<div class="auto">
    <div>One</div>
    <div>Two</div>
    <div>Three</div>
    <div>Four</div>
    <div>Five</div>
</div>

</body>
</html>
